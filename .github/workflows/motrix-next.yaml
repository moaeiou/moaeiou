name: Hating you is overrated(motrix-next)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Unless you understand it
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@main
      
      - name: Prepare
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel
          mv .github/mn/PKGBUILD ./PKGBUILD
          mv .github/mn/LICENSE ./LICENSE
          source PKGBUILD
          deps=("${depends[@]}" "${makedepends[@]}")
          pacman -S --needed --noconfirm "${deps[@]}"

      - name: Create build user
        shell: bash
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build!
        shell: bash
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg -s --noconfirm --needed"
          rm ./motrix-next-debug*

      - name: Clear release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(gh api \
            "/repos/moaeiou/moaeiou/releases/tags/motrix-next" \
            --jq '.id')
          echo "Release ID: ${release_id}"
          gh api \
            --paginate \
            "/repos/moaeiou/moaeiou/releases/${release_id}/assets?per_page=100" \
            --jq '.[].id' |
          while read -r asset_id; do
            echo "Deleting asset ${asset_id}"
            gh api \
              --method DELETE \
              "/repos/moaeiou/moaeiou/releases/assets/${asset_id}"
          done

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: motrix-next
          files: ./*.tar.zst
          body: |
            # 📝 Release Notes
            - Fixes and improvements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
