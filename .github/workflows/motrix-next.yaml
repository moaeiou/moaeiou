name: Hating you is overrated

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Unless you understand it
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@main
      
      - name: Prepare
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel
          mv .github/mn/PKGBUILD ./PKGBUILD
          mv .github/mn/LICENSE ./LICENSE
          source PKGBUILD
          deps=("${depends[@]}" "${makedepends[@]}")
          pacman -S --needed --noconfirm "${deps[@]}"

      - name: Create build user
        shell: bash
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build!
        shell: bash
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg -s --noconfirm --needed"
          rm ./motrix-next-debug*

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: motrix-next
          files: ./*.tar.zst
          body: |
            # 📝 Release Notes
            - Fixes and improvements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
