name: And find out want to do(sing-box)

on:
  schedule:
    - cron: '0 */4 * * *'
  # push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Binary:
    name: Build sing-box-${{ matrix.branch }}-${{ matrix.nickname }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nickname: "linux-amd64v4-glibc-server"
            branch: "testing"
            extra: "GOAMD64=v4"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64v3-glibc-server"
            branch: "testing"
            extra: "GOAMD64=v3"
            tag: "with_quic with_utls with_acme with_wireguard tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64v2-glibc-server"
            branch: "testing"
            extra: "GOAMD64=v2"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64-musl-server"
            branch: "testing"
            extra: "CGO_ENABLED=0"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-arm64v9.2-glibc-server"
            branch: "testing"
            extra: "CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOARCH=arm64 GOARM64=v9.2"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-arm64v9-glibc-server"
            branch: "testing"
            extra: "CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOARCH=arm64 GOARM64=v9.0"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-arm64v8.2-musl-server"
            branch: "testing"
            extra: "CGO_ENABLED=0 GOARCH=arm64 GOARM64=v8.2"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-arm64v8-musl-server"
            branch: "testing"
            extra: "CGO_ENABLED=0 GOARCH=arm64 GOARM64=v8.0"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-arm64-musl-server"
            branch: "testing"
            extra: "CGO_ENABLED=0 GOARCH=arm64"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64v4-glibc-v2rayN"
            branch: "stable"
            extra: "GOAMD64=v4"
            tag: "with_quic with_wireguard with_utls with_clash_api with_gvisor tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64v3-glibc-v2rayN"
            branch: "stable"
            extra: "GOAMD64=v3"
            tag: "with_quic with_wireguard with_utls with_acme with_clash_api with_gvisor tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64v2-glibc-v2rayN"
            branch: "stable"
            extra: "GOAMD64=v2"
            tag: "with_quic with_wireguard with_utls with_clash_api with_gvisor tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64v1-glibc-v2rayN"
            branch: "stable"
            extra: "GOAMD64=v1"
            tag: "with_quic with_wireguard with_utls with_clash_api with_gvisor tfogo_checklinkname0 badlinkname"
          - nickname: "darwin-arm64-v2rayN"
            branch: "stable"
            extra: "GOOS=darwin GOARCH=arm64"
            tag: "with_quic with_wireguard with_utls with_clash_api with_gvisor tfogo_checklinkname0 badlinkname"

    steps:
      - name: Clone source code
        shell: bash
        run: |
          rm -rf */
          git clone --branch ${{ matrix.branch }} https://github.com/SagerNet/sing-box.git ./
          git pull
          git fetch --tags --force
          mv ./go.mod ./go.mod.backup

      - name: Set up Go
        uses: actions/setup-go@main
        with:
          go-version: 'stable'

      - name: Install ARM64 cross compiler
        if: contains(matrix.extra, 'CC=aarch64-linux-gnu-gcc')
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build!
        shell: bash
        run: |
          mv ./go.mod.backup ./go.mod
          sed -i 's/GOOS=$(GOHOSTOS) GOARCH=$(GOHOSTARCH) go run/GOOS=$(GOHOSTOS) GOARCH=$(GOHOSTARCH) GOAMD64= go run/' ./Makefile
          VALE=$(go run ./cmd/internal/read_tag)
          ${{ matrix.extra }} TAGS="${{ matrix.tag }}" VERSION="$VALE" make -j$(nproc)
          mv ./sing-box ./sing-box-${{ matrix.branch }}-${{ matrix.nickname }}

      - name: Upload OpenWrt binary
        if: matrix.nickname == 'linux-amd64-musl-server' || matrix.nickname == 'linux-arm64v8-musl-server'
        uses: actions/upload-artifact@main
        with:
          name: sing-box-${{ matrix.nickname }}
          path: sing-box-${{ matrix.branch }}-${{ matrix.nickname }}
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: sing-box
          files: sing-box-${{ matrix.branch }}-${{ matrix.nickname }}
          target_commitish: main
          body:
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Send to mirror
        uses: moaeiou/moaeiou/actions/rsync@main
        with:
          local: sing-box-${{ matrix.branch }}-${{ matrix.nickname }}
          remote: sing-box/
          key: ${{ secrets.SSH_KEY }}

  OpenWrt:
    name: Package sing-box-${{ matrix.pkg_arch }}
    needs: Binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg_arch: x86_64
            sdk_arch: x86-64
            binary: linux-amd64-musl-server
          - pkg_arch: aarch64_generic
            sdk_arch: rockchip-armv8
            binary: linux-arm64v8-musl-server
          - pkg_arch: aarch64_cortex-a53
            sdk_arch: mediatek-filogic
            binary: linux-arm64v8-musl-server
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Download binary
        uses: actions/download-artifact@main
        with:
          name: sing-box-${{ matrix.binary }}
          path: binary

      - name: Prepare SDK
        id: sdk
        uses: moaeiou/moaeiou/actions/prepare-sdk@main
        with:
          sdk_arch: ${{ matrix.sdk_arch }}

      - name: Prepare package
        shell: bash
        env:
          SDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
          PKG_ARCH: ${{ matrix.pkg_arch }}
          BINARY: ${{ matrix.binary }}
        run: |
          cp -a sing-box "$SDK_DIR/package/sing-box"
          sed -i "s/^LUCI_PKGARCH:=.*/LUCI_PKGARCH:=$PKG_ARCH/" "$SDK_DIR/package/sing-box/Makefile"
          install -m 0755 "binary/sing-box-testing-$BINARY" "$SDK_DIR/package/sing-box/root/usr/bin/sing-box"
          rm -f "$SDK_DIR/package/sing-box/root/usr/bin/DONOTREMOVE"

      - name: Build APK
        shell: bash
        env:
          SDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
          PKG_ARCH: ${{ matrix.pkg_arch }}
        run: |
          cd "$SDK_DIR"
          make package/sing-box/compile V=s -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE/apk"
          files=(bin/packages/*/*/sing-box-*.apk)
          [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ]
          cp "${files[0]}" "$GITHUB_WORKSPACE/apk/sing-box-$PKG_ARCH.apk"

      - name: Upload APK
        uses: actions/upload-artifact@main
        with:
          name: sing-box-apk-${{ matrix.pkg_arch }}
          path: apk/*.apk
          if-no-files-found: error

      - name: Release APK
        uses: softprops/action-gh-release@master
        with:
          tag_name: sing-box
          files: apk/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
