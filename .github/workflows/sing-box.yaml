name: And find out want to do(sing-box)

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build sing-box-${{ matrix.branch }}-${{ matrix.nickname }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 SERVER
          - nickname: "linux-amd64v4-glibc-server"
            branch: "testing"
            extra: "GOAMD64=v4 CC=gcc"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64v3-glibc-server"
            branch: "testing"
            extra: "GOAMD64=v3 CC=gcc"
            tag: "with_quic with_utls with_acme with_wireguard tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64v2-glibc-server"
            branch: "testing"
            extra: "GOAMD64=v2 CC=gcc"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64-server"
            branch: "testing"
            extra: "CGO_ENABLED=0"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          # ARM64 SERVER
          - nickname: "linux-arm64v9.2-glibc-server"
            branch: "testing"
            extra: "CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc GOARCH=arm64 GOARM64=v9.2"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-arm64v8-server"
            branch: "testing"
            extra: "CGO_ENABLED=0 GOARCH=arm64 GOARM64=v8.0"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          - nickname: "linux-arm64-server"
            branch: "testing"
            extra: "CGO_ENABLED=0 GOARCH=arm64"
            tag: "with_quic with_utls with_acme tfogo_checklinkname0 badlinkname"
          # For V2rayN users
          - nickname: "linux-amd64v4-glibc-v2rayN"
            branch: "stable"
            extra: "GOAMD64=v4 CC=gcc"
            tag: "with_quic with_wireguard with_utls with_clash_api with_gvisor tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64v3-glibc-v2rayN"
            branch: "stable"
            extra: "GOAMD64=v3 CC=gcc"
            tag: "with_quic with_wireguard with_utls with_acme with_clash_api with_gvisor tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64v2-glibc-v2rayN"
            branch: "stable"
            extra: "GOAMD64=v2 CC=gcc"
            tag: "with_quic with_wireguard with_utls with_clash_api with_gvisor tfogo_checklinkname0 badlinkname"
          - nickname: "linux-amd64v1-glibc-v2rayN"
            branch: "stable"
            extra: "GOAMD64=v1 CC=gcc"
            tag: "with_quic with_wireguard with_utls with_clash_api with_gvisor tfogo_checklinkname0 badlinkname"
          # For macOS users
          - nickname: "darwin-arm64-v2rayN"
            branch: "stable"
            extra: "GOOS=darwin GOARCH=arm64"
            tag: "with_quic with_wireguard with_utls with_clash_api with_gvisor tfogo_checklinkname0 badlinkname"

    steps:
      - name: Clone source code
        shell: bash
        run: |
          rm -rf */
          git clone --branch ${{ matrix.branch }} https://github.com/SagerNet/sing-box.git ./
          git pull
          git fetch --tags --force

      - name: Set up Go
        uses: actions/setup-go@main
        with:
          go-version: 'stable'
          cache: false

      - name: Update dependices
        shell: bash
        if: matrix.branch == 'testing'
        run: |
          go get -u ./...

      - name: Build!
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          sed -i 's/GOOS=$(GOHOSTOS) GOARCH=$(GOHOSTARCH) go run/GOOS=$(GOHOSTOS) GOARCH=$(GOHOSTARCH) GOAMD64= go run/' ./Makefile
          VALE=$(go run ./cmd/internal/read_tag)
          ${{ matrix.extra }} TAGS="${{ matrix.tag }}" VERSION="$VALE" make -j$(nproc)
          mv ./sing-box ./sing-box-${{ matrix.branch }}-${{ matrix.nickname }}

      - name: UPX!
        shell: bash
        if: matrix.nickname == 'linux-arm64v8-musl-server'
        run: |
          upx --best --lzma -o ./sing-box-${{ matrix.branch }}-${{ matrix.nickname }}-upx ./sing-box-${{ matrix.branch }}-${{ matrix.nickname }}

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: sing-box
          files: sing-box-${{ matrix.branch }}-${{ matrix.nickname }}*
          body:
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Send to mirror
        uses: moaeiou/moaeiou/actions/rsync@main
        with:
          local: sing-box-${{ matrix.branch }}-${{ matrix.nickname }}*
          remote: sing-box/
          key: ${{ secrets.SSH_KEY }}
