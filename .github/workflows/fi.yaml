          - sdk_arch: "x86-64"
    steps:
      - name: cabeza
        shell: bash
        run: |
          sdk_name=openwrt-sdk-${{ matrix.sdk_arch }}_gcc-14.4.0_musl.Linux-x86_64
          echo "sdk_name=$sdk_name" >> $GITHUB_OUTPUT
          echo "LA"
          curl -LO https://la.867678.xyz/sdk/$sdk_name.tar.zst
