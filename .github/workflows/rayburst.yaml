name: Hating you is overrated(Rayburst)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clear:
    name: I could live with it, out!
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clear assets
        shell: bash
        run: |
          release_id=$(gh api \
            "/repos/moaeiou/moaeiou/releases/tags/rayburst" \
            --jq '.id')
          gh api \
            --paginate \
            "/repos/moaeiou/moaeiou/releases/${release_id}/assets?per_page=5" \
            --jq '.[].id' |
          while read -r asset_id; do
            echo "Deleting asset ${asset_id}"
            gh api \
              --method DELETE \
              "/repos/moaeiou/moaeiou/releases/assets/${asset_id}"
          done

  build:
    needs: clear
    runs-on: ubuntu-latest
    name: Unless you understand it
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@main
      
      - name: Prepare
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel
          mv .github/PKGBUILD ./PKGBUILD
          source PKGBUILD
          deps=("${depends[@]}" "${makedepends[@]}")
          pacman -S --needed --noconfirm "${deps[@]}"

      - name: Build!
        shell: bash
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg -s --noconfirm --needed"
          rm ./rayburst-debug*

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: rayburst
          files: ./*.tar.zst
          body: |
            # 📝 Release Notes
            - Fixes and improvements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
