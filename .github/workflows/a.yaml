name: NO NONONO

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clear:
    name: I could live with it, out!
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - patch_arch: "x86_64"
            sdk_arch: "x86-64"
            dickname: "linux-amd64-musl"
          - patch_arch: "aarch64_generic"
            sdk_arch: "rockchip-armv8"
            dickname: "linux-arm64v8"
          - patch_arch: "aarch64_cortex-a53"
            sdk_arch: "mediatek-filogic"
            dickname: "linux-arm64v8"
    steps:
      - name: cabeza
        shell: bash
        run: |
          sdk_name=openwrt-sdk-${{ matrix.sdk_arch }}_gcc-14.4.0_musl.Linux-x86_64
          echo "sdk_name=$sdk_name" >> $GITHUB_OUTPUT

          curl --resolve la.867678.xyz:443:23.95.28.150 -LO https://la.867678.xyz/sdk/$sdk_name.tar.zst
