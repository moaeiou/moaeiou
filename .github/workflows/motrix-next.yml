name: Package Motrix Next

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@main
      
      - name: Prepare
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel
          mv .github/mn/PKGBUILD ./PKGBUILD
          mv .github/mn/LICENSE ./LICENSE
          source PKGBUILD
          deps=("${depends[@]}" "${makedepends[@]}")
          pacman -S --needed --noconfirm "${deps[@]}"

      - name: Create build user
        shell: bash
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build!
        shell: bash
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg -s --noconfirm --needed"

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: motrix-next
          files: ./*.pkg.tar.zst
          body: |
            # 📝 Release Notes
            - Fixes and improvements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to mirror
        uses: moaeiou/moaeiou/actions/rsync@main
        with:
          local: ./*.pkg.tar.zst
          remote: /var/www/html/motrix-next/
          key: ${{ secrets.SSH_KEY }}
