name: Prepare SDK
description: Unified SDK preparation for multiple architectures
inputs:
  sdk_arch:
    description: SDK arch name
    required: true
  gcc_version:
    description: Upstream GCC version
    required: true
    default: "14.4.0"
  server:
    description: Download server
    required: true
    default: la.mirrors.867678.xyz
outputs:
  sdk_dir:
    description: Extracted SDK directory name for downstream use
    value: ${{ steps.sdk_dir.outputs.dir_name }}

runs:
  using: "composite"
  steps:
    - name: Preparing build environment
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install build-essential gettext xsltproc python3-pyelftools

    - name: Get SDK Full Directory Name & Download and Initialize SDK
      id: sdk_dir
      shell: bash
      run: |
        set -e

        echo "dir_name=openwrt-sdk-${{ inputs.sdk_arch }}_gcc-${{ inputs.gcc_version }}_musl.Linux-x86_64" >> $GITHUB_OUTPUT

        curl -LO https://${{ inputs.server }}/sdk/${{ steps.sdk_dir.outputs.dir_name }}.tar.zst

        tar -xvf ${{ steps.sdk_dir.outputs.dir_name }}.tar.zst
        rm ${{ steps.sdk_dir.outputs.dir_name }}.tar.zst
        cd ${{ steps.sdk_dir.outputs.dir_name }}

        make defconfig
        ./scripts/feeds update -a
        ./scripts/feeds install -a
