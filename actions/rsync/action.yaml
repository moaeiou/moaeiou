name: Syncer
description: Sync file to mirror

inputs:
  local:
    description: local file path
    required: true
  remote:
    description: remote file path
    required: false
  key:
    description: remote host key
    required: true
  extra:
    description: extra arguments
    required: false

runs:
  using: "composite"
  env:
    server: la.867678.xyz
  steps:
    - name: Setup SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.key }}" >> ~/.ssh/rw_key
        chmod 600 ~/.ssh/rw_key
        ssh-keyscan ${{ env.server }} >> ~/.ssh/known_hosts

    - name: Conexionario
      shell: bash
      run: |
        rsync -avzh --progress ${{ inputs.extra }} -e "ssh -i ~/.ssh/rw_key -p 22" ${{ inputs.local }} root@${{ env.server }}:/var/www/html/${{ inputs.remote }}
