name: Syncer
description: Sync file to mirror

inputs:
  local:
    description: local file path
    required: true
  remote:
    description: remote file path
    required: false
  key:
    description: remote host key
    required: true
  extra:
    description: extra arguments
    required: false

env:
    server: la.867678.xyz

runs:
  using: "composite"
  steps:
    - name: Fuck a server
      shell: bash
      run: |
        echo "la.867678.xyz" >> "$GITHUB_ENV"

    - name: Setup SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.key }}" >> ~/.ssh/rw_key
        chmod 600 ~/.ssh/rw_key
        ssh-keyscan $SERVER >> ~/.ssh/known_hosts

    - name: Conexionario
      shell: bash
      run: |
        rsync -avzh --progress ${{ inputs.extra }} -e "ssh -i ~/.ssh/rw_key -p 22" ${{ inputs.local }} root@$SERVER:/var/www/html/${{ inputs.remote }}
